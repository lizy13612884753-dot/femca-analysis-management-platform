name: Python Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Version
        run: python --version

      - name: Install Dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply Database Migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Generate CI Credentials
        run: |
          echo "CI_TEST_USERNAME=ci_test_user" >> "$GITHUB_ENV"
          echo "CI_TEST_EMAIL=ci_test_user@example.com" >> "$GITHUB_ENV"
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$password"
          echo "CI_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Create CI User
        working-directory: backend
        run: python create_ci_user.py

      - name: Run Pytest
        working-directory: backend
        run: python -m pytest tests/test_api_client_exceptions.py tests/test_fixture_practice.py tests/test_api_client_headers.py -v --junitxml=pytest-report.xml

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml