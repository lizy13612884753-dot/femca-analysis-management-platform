name: Python Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Version
        run: python --version

      - name: Install Dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply Database Migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Generate CI Credentials
        run: |
          echo "CI_TEST_USERNAME=ci_test_user" >> "$GITHUB_ENV"
          echo "CI_TEST_EMAIL=ci_test_user@example.com" >> "$GITHUB_ENV"
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$password"
          echo "CI_TEST_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Create CI User
        working-directory: backend
        run: python create_ci_user.py

      - name: Start Django Server
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > django-server.log 2>&1 &
          for i in {1..10}; do
            echo "Checking Django server: attempt $i"
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8000/; then
              echo "Django server is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Django server failed to start"
              cat django-server.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Pytest
        working-directory: backend
        run: python -m pytest tests/test_api_client_exceptions.py tests/test_fixture_practice.py tests/test_api_client_headers.py -v --junitxml=pytest-report.xml

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml